name: Test & deploy to EC2

# PR opened/updated  -> "Core functionality check" (shows as a check on the PR)
# PR merged to main  -> same check, then automatic deploy to the EC2 + live check,
#                       with automatic rollback to the previous version if the live check fails
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'deploy-ec2' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Core functionality check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Python files compile
        run: python -m py_compile app.py aqi_engine.py forecasting.py train.py retention.py synthetic_data.py tools/*.py
      - name: Fake data + retention (new hardware and current firmware formats)
        run: |
          python tools/seed_fake_data.py --db /tmp/seed_new.db --days 12 --cleanup
          python tools/seed_fake_data.py --db /tmp/seed_old.db --days 12 --legacy --cleanup
      - name: Pages load and APIs return data (fake ESP32)
        env:
          AQMS_DB: /tmp/seed_new.db
          LEGACY_POLL: "0"
        run: |
          python app.py > /tmp/app.log 2>&1 &
          python tools/smoke_check.py --url http://127.0.0.1:5000 --ingest || { echo "---- app log ----"; tail -80 /tmp/app.log; exit 1; }

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
      APP: /home/ubuntu/air-quality-aws
    steps:
      - uses: actions/checkout@v5
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
      - name: Snapshot the running version (for rollback)
        run: ssh -i ~/.ssh/ec2.pem "$TARGET" "rsync -a --delete --exclude venv/ --exclude trained_models/ --exclude '*.db*' $APP/ /home/ubuntu/aqms_prev/"
      - name: Upload code (keeps database, venv and server-trained models)
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/ec2.pem" \
            --exclude '.git/' --exclude '.github/' --exclude 'venv/' \
            --exclude '*.db' --exclude '*.db-journal' --exclude '*.db-wal' --exclude '*.db-shm' \
            --exclude 'trained_models/' --exclude '.requirements*.sha' --exclude '__pycache__/' \
            ./ "$TARGET:$APP/"
      - name: Install, restart, health check
        run: ssh -i ~/.ssh/ec2.pem "$TARGET" "bash $APP/deploy/ci_deploy.sh"
      - name: Live core functionality check (read-only)
        run: python3 tools/smoke_check.py --url "http://${{ secrets.EC2_HOST }}:5000" --wait 90
      - name: Roll back to the previous version
        if: failure()
        run: |
          echo "Deploy or live check failed - restoring the previous version"
          ssh -i ~/.ssh/ec2.pem "$TARGET" "test -d /home/ubuntu/aqms_prev && rsync -a --delete --exclude venv/ --exclude trained_models/ --exclude '*.db*' /home/ubuntu/aqms_prev/ $APP/ && bash $APP/deploy/ci_deploy.sh"
          python3 tools/smoke_check.py --url "http://${{ secrets.EC2_HOST }}:5000" --wait 90
